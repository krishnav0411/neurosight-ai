# NeuroSight AI — pre-commit gates (plan T0.4)
# Install: pre-commit install   |   Run all: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=4096"]   # guards against committing weights/caches
        exclude: '^models/(manifest\.json|best_7_dual_attn_final_.*\.pth)$'
      # the deployed 5-seed ensemble is intentionally committed (~6.4 MB/file);
      # everything else stays under the 4 MB guard
      - id: check-added-large-files
        name: check-added-large-files (models/ serving weights)
        args: ["--maxkb=10240"]
        files: '^models/(manifest\.json|best_7_dual_attn_final_.*\.pth)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
