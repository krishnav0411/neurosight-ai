# NeuroSight AI — training configuration.
# Values inherited from the predecessor project's tuned configs (RTX 4050 6 GB).
training:
  epochs: 50
  batch_size: 4
  batch_size_3d: 2
  grad_accum_3d: 4             # effective 3D batch = 8

  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  patience: 7
  scheduler_patience: 3
  scheduler_factor: 0.5
  min_lr: 1.0e-6
  clip_norm: 1.0

  use_focal: false
  label_smoothing: 0.0
  use_sampler: false

  n_folds: 5
  seed: 42
  deterministic: true          # cudnn.deterministic=True, benchmark=False
  cudnn_benchmark: false
  num_workers: 0               # Windows constraint — do not raise without testing

  early_stop_metric: "val_auc" # model selection on AUC, not accuracy (imbalanced)

  checkpoint_dir: "models"
  experiment_name: "neurosight_baseline"
  use_mlflow: true
  mlflow_tracking_uri: "sqlite:///mlruns/mlflow.db"
